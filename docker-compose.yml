
services:
  bioneetpro-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioneetpro-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=false
      - ALLOWED_ORIGINS=http://localhost:5000,http://127.0.0.1:5000,http://localhost:5500,http://127.0.0.1:5500
      - OPENROUTER_MODEL=openai/gpt-4o-mini
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - ./data/chat_threads:/app/data/chat_threads
      - ./data/dialogue_states:/app/data/dialogue_states
      - ./data/student_profiles:/app/data/student_profiles
      - ./data/tutor_states:/app/data/tutor_states
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
